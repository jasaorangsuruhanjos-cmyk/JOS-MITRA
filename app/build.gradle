plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'id.my.jasaorangsuruhan.mitra'
    compileSdk 35

    defaultConfig {
        applicationId 'id.my.jasaorangsuruhan.mitra'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
