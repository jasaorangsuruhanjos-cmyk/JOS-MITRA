name: Build JOS Mitra Android APK

on:
  push:
    branches:
      - staging/android-apk-permissions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
      - name: Download JOS Mitra launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          curl -fsSL https://raw.githubusercontent.com/jasaorangsuruhanjos-cmyk/JOS-MITRA/staging/android-apk-permissions/jos-mitra-512.png -o app/src/main/res/drawable-nodpi/jos_mitra.png
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jos-mitra-staging-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
